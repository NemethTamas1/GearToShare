services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geartoshare_backend
    restart: unless-stopped
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - geartoshare

  nginx:
    image: nginx:stable-alpine
    container_name: geartoshare_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - geartoshare

  db:
    image: mysql:8.0
    container_name: geartoshare_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-geartoshare}
      - MYSQL_USER=${DB_USERNAME:-geartoshare}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - geartoshare_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - geartoshare

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: geartoshare_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - geartoshare

networks:
  geartoshare:
    driver: bridge

volumes:
  geartoshare_db_data:
    driver: local