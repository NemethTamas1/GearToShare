# fly.toml app configuration file generated for geartoshare-db-staging on 2026-09-04T12:26:04+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'geartoshare-db-staging'
primary_region = 'fra'

[build]
  image = 'mysql:8.0'

[[services]]
  internal_port = 3306
  protocol = "tcp"

  [[services.ports]]
    port = 3306

[mounts]
  source = "geartoshare_db_data"
  destination = "/var/lib/mysql"

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 1024
