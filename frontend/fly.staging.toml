# fly.toml app configuration file generated for geartoshare-frontend-staging on 2026-09-14T09:53:31+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'geartoshare-frontend-staging'
primary_region = 'fra'

[build]
  [build.args]
    VITE_API_URL = "https://api.staging.geartoshare.hu"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 1024
