name: Backend tests
on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend.yml'
    
  deploy:
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Start database machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DB }}
        run: |
          MACHINE_ID=$(flyctl machine list --app geartoshare-db-staging --json | jq -r '.[0].id')
          flyctl machine start "$MACHINE_ID" --app geartoshare-db-staging || true
          sleep 15

      - name: Deploy backend
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.staging.toml --app geartoshare-backend-staging

      - name: Stop database machine
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DB }}
        run: |
          MACHINE_ID=$(flyctl machine list --app geartoshare-db-staging --json | jq -r '.[0].id')
          flyctl machine stop "$MACHINE_ID" --app geartoshare-db-staging || true
      